name: Scheme Saathi CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  secret-scan:
    name: Security & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Secret Scan
        run: |
          python - << 'EOF'
          import os, re, sys

          PATTERNS = {
              "google_client_secret": re.compile(r"GOCSPX-[a-zA-Z0-9_-]{20,}", re.I),
              "groq_api_key": re.compile(r"gsk_[a-zA-Z0-9]{30,}", re.I),
              "private_key": re.compile(r"-----BEGIN (?:RSA |EC )?PRIVATE KEY-----"),
              "aws_secret": re.compile(r"(?:AKIA|ASIA)[0-9A-Z]{16}"),
          }

          EXCLUDE_DIRS = {".git", ".venv", "venv", "node_modules", "dist", "build", "__pycache__", ".pytest_cache"}
          EXCLUDE_FILES = {"package-lock.json"}

          findings = []
          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d not in EXCLUDE_DIRS]
              for file in files:
                  if file in EXCLUDE_FILES or file.endswith(".example"):
                      continue
                  filepath = os.path.join(root, file)
                  try:
                      with open(filepath, "r", encoding="utf-8", errors="ignore") as f:
                          content = f.read()
                          for name, pattern in PATTERNS.items():
                              matches = pattern.findall(content)
                              if matches:
                                  findings.append((filepath, name))
                  except Exception:
                      pass

          if findings:
              print(f"FAILED: Found {len(findings)} potential secret patterns in repository:")
              for p, n in findings:
                  print(f"  - {p} ({n})")
              sys.exit(1)
          else:
              print("PASSED: Secret scan clean. No sensitive credentials found in tracked files.")
          EOF

  backend-tests:
    name: Backend Test Suite (FastAPI + Pytest)
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest Suite
        env:
          PYTHONPATH: backend
          ENVIRONMENT: testing
          SECRET_KEY: test_secret_key_sih26092_ci_runner
          FAISS_INDEX_PATH: data/scheme_vectors.index
          SCHEMES_JSON_PATH: data/schemes.json
        run: |
          pytest backend/tests/ -q

  frontend-build:
    name: Frontend Build & Verification (Vite + React)
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Production Bundle
        working-directory: ./frontend
        env:
          VITE_API_BASE_URL: https://api.schemesaathi.gov.in
        run: npm run build
